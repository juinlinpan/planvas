name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  linux-container:
    name: Build Linux Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        shell: bash
        run: |
          expected="v$(node -p "require('./app.version.json').version")"
          actual="${{ github.ref_name }}"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Release tag ${actual} does not match app.version.json (${expected})." >&2
            exit 1
          fi

      - name: Set image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.title=Planvas
            org.opencontainers.image.description=Planvas web server
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}

  windows-desktop:
    name: Build Windows Desktop
    needs: linux-container
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Sync release version
        run: npm run version:sync

      - name: Validate release tag
        shell: pwsh
        run: |
          $config = Get-Content app.version.json -Raw | ConvertFrom-Json
          $expected = "v$($config.version)"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) {
            Write-Error "Release tag $actual does not match app.version.json ($expected)."
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test frontend
        run: npm run test --workspace frontend

      - name: Test backend
        run: npm run test --workspace backend

      - name: Build web and backend
        run: npm run build

      - name: Prepare packaged Node runtime
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Copy-Item -Path $node -Destination src-tauri/bin/node.exe -Force

      - name: Build desktop installer
        run: npm run desktop:build

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -eq ".exe" }
          )

          if ($assets.Count -eq 0) {
            Write-Error "No NSIS installer asset was found."
          }

          gh release create $tag `
            --repo "${{ github.repository }}" `
            --title $tag `
            --notes "Planvas $tag`n`nLinux container image: ``ghcr.io/${{ github.repository }}:$tag``" `
            $assets.FullName
